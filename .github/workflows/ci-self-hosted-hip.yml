name: CI (self-hosted HIP backend)

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/ci-self-hosted-hip.yml',
      'ci/run.sh',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      'ggml/src/ggml-hip/**',
      'ggml/src/ggml-cuda/**'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/ci-self-hosted-hip.yml',
      'ci/run.sh',
      '**/CMakeLists.txt',
      '**/.cmake',
      'ggml/src/ggml-hip/**',
      'ggml/src/ggml-cuda/**'
    ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # note: this is dud token to avoid rate limiting (https://github.com/ggml-org/llama.cpp/pull/25706#issuecomment-4979941302)
  HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1

jobs:
  # Strix Halo (gfx1151) HIP smoke build. Verifies the rdna3_5 MMQ config compiles
  # and runs a quick benchmark. Only fires on a self-hosted runner tagged STRIX-HALO.
  amd-rocm-strix-halo:
    runs-on: [self-hosted, Linux, AMD, STRIX-HALO]
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Smoke build
        id: ggml-ci
        run: |
          amd-smi static
          GG_BUILD_ROCM=1 GG_BUILD_AMDGPU_TARGETS="gfx1151" bash ./ci/run.sh ~/results/llama.cpp ~/mnt/llama.cpp
